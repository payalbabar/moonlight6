<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="svOuterShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#7a5af8" />
      <stop offset="100%" stop-color="#ff4694" />
    </linearGradient>

    <linearGradient id="svCoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e87a" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#9b6dff" />
    </linearGradient>

    <radialGradient id="svIrisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#7a5af8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="svStegoBits" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e87a" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>

    <filter id="svNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon
    points="50,6 90,26 90,74 50,94 10,74 10,26"
    fill="#080e1c"
    stroke="url(#svOuterShield)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Steganographic Matrix Grid Dots -->
  <g opacity="0.5">
    <line x1="24" y1="36" x2="76" y2="36" stroke="#4d9fff" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#7a5af8" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="24" y1="64" x2="76" y2="64" stroke="#4d9fff" stroke-width="1" stroke-dasharray="2 3" />
    <rect x="28" y="34" width="4" height="4" rx="1" fill="url(#svStegoBits)" />
    <rect x="68" y="34" width="4" height="4" rx="1" fill="url(#svStegoBits)" />
    <rect x="70" y="62" width="4" height="4" rx="1" fill="url(#svStegoBits)" />
    <rect x="26" y="62" width="4" height="4" rx="1" fill="url(#svStegoBits)" />
  </g>

  <!-- Midnight ZK Orbit Ring -->
  <circle
    cx="50"
    cy="50"
    r="26"
    stroke="url(#svCoreGlow)"
    stroke-width="2"
    stroke-dasharray="9 5 18 4"
    fill="url(#svIrisGlow)"
  />

  <!-- Vault Lock Core -->
  <g transform="translate(50, 50)">
    <path
      d="M-8,-5 V-12 C-8,-16.5 -4.5,-20 0,-20 C4.5,-20 8,-16.5 8,-12 V-5"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
    <rect
      x="-14"
      y="-5"
      width="28"
      height="24"
      rx="4"
      fill="#0d182e"
      stroke="url(#svOuterShield)"
      stroke-width="2.5"
    />
    <circle cx="0" cy="5" r="4" fill="#00e87a" />
    <path d="M0,7 V13" stroke="#00e87a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Corner Glowing Nodes -->
  <circle cx="50" cy="6" r="3" fill="#00d4ff" />
  <circle cx="90" cy="26" r="2.5" fill="#7a5af8" />
  <circle cx="90" cy="74" r="2.5" fill="#ff4694" />
  <circle cx="50" cy="94" r="3" fill="#00e87a" />
  <circle cx="10" cy="74" r="2.5" fill="#00d4ff" />
  <circle cx="10" cy="26" r="2.5" fill="#7a5af8" />
</svg>
